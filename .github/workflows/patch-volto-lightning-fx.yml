name: Patch Volto lightning FX

on:
  push:
    paths:
      - '.github/workflows/patch-volto-lightning-fx.yml'
      - '.github/scripts/patch_volto_fx.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Volto FX patch
        run: python .github/scripts/patch_volto_fx.py
      - name: Commit FX patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add staged Volto lightning FX and spectacular charged impact"
          git pull --rebase origin main
          git push origin HEAD:main
