name: Nans Companion Tests

on:
  push:
    branches: [main, feature/nans-encounter-integration-20261008]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nans Volto and connected profile tests
        run: node tests/volto-regression.cjs
