name: Patch Nans autosave

on:
  push:
    paths:
      - '.github/workflows/patch-autosave.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch autosave
        run: python scripts/patch_autosave.py
      - name: Commit autosave patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add persistent autosave and restore for Nans"
          git pull --rebase origin main
          git push origin HEAD:main
